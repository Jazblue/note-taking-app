<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note-Taking App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Note-Taking App</h1>
            <nav>
                <button onclick="loadAllNotes()" class="btn btn-primary">All Notes</button>
                <button onclick="showNoteForm()" class="btn btn-success">New Note</button>
                <button onclick="loadSearchResults()" class="btn btn-secondary">Search</button>
            </nav>
        </header>

        <main>
            <!-- Note Form -->
            <section id="note-form" class="form-section">
                <h2>Create a New Note</h2>
                <form id="note-form" method="POST">
                    <div class="form-group">
                        <label for="title">Title *</label>
                        <input type="text" id="title" name="title" required minlength="1" maxlength="100">
                    </div>
                    <div class="form-group">
                        <label for="content">Content</label>
                        <textarea id="content" name="content" required minlength="1"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Note</button>
                </form>
            </section>

            <!-- Search Results -->
            <section id="search-results" class="results-section">
                <h2>Search Results</h2>
                <input type="text" id="search-input" placeholder="Search notes..." onkeyup="loadSearchResults()">
                <ul id="search-list" class="results-list"></ul>
            </section>

            <!-- Single Note View -->
            <section id="note-view" class="note-section hidden">
                <h2 id="note-title">No note selected</h2>
                <div id="note-content"></div>
                <div class="actions">
                    <button onclick="editNote(this)" class="btn btn-editing">Edit</button>
                    <button onclick="deleteNote(this)" class="btn btn-danger">Delete</button>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
